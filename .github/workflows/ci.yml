name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check discovered tool formatting
        run: cargo run -p devtools-tools --bin tools-fmt -- --check
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
