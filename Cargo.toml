[workspace]
members = [
    "crates/devtools-clipboard",
    "crates/devtools-hub",
    "crates/devtools-json",
    "crates/devtools-search",
    "crates/devtools-search/core",
    "crates/devtools-ui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/zvae/devtools_hub"
rust-version = "1.95"
version = "0.1.6"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0"
# 不启用 egui-wgpu 默认的 `macos-window-resize-jitter-fix`（eframe 的 `wgpu` 特性会带上它）：它在窗口改变大小时
# 打开 CAMetalLayer 的 presentsWithTransaction，直到窗口收到别的事件才关掉。贴图连续缩放时窗口一直在改变大小，
# 画面要等没人提交的 CoreAnimation 事务，nextDrawable 每隔几帧就阻塞 1 秒（实测缩小时尤其明显）。
# 其余特性与 eframe 默认的一致（Linux / Web 专用的 wayland、x11、web_screen_reader 以及 winit 的默认特性不需要）。
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "links",
    "wgpu_no_default_features",
] }
egui = "0.36"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp", "webp"] }
objc2 = "0.6"
# 只启用用到的类：默认特性会编译整个 AppKit（单个 rlib 近 180 MB）。
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "NSApplication",
    "NSBitmapImageRep",
    "NSEvent",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPanel",
    "NSOpenPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSURL",
] }
# 文字识别（macOS）：Vision 的 VNRecognizeTextRequest，只启用用到的类。
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
] }
raw-window-handle = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
# 检查更新用的 HTTP 客户端。TLS 用系统自带的实现与根证书（macOS Security.framework、Windows SChannel），
# 不额外编译 rustls；Windows 上还会读取系统代理设置，两个平台都支持 HTTPS_PROXY 等环境变量。
ureq = { version = "3.4", default-features = false, features = ["native-tls", "win-system-proxy"] }
winit = { version = "0.30", default-features = false }
# 文字识别（Windows）：WinRT 的 Windows.Media.Ocr（windows-sys 只有 Win32 接口，没有 WinRT）。
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_WinRT",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
winresource = "0.1"
zstd = "0.13"
# 只为打开 wgpu 的默认特性（各平台的图形后端）：eframe 不带 egui-wgpu 的默认特性后不再替我们打开（见上面的 eframe）。
wgpu = "30"

globset = "0.4"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rayon = "1.10"
regex = "1"
unicode-normalization = "0.1"

devtools-clipboard = { path = "crates/devtools-clipboard" }
devtools-json = { path = "crates/devtools-json" }
devtools-search = { path = "crates/devtools-search" }
devtools-ui = { path = "crates/devtools-ui" }

# macOS 上 dev 默认 split-debuginfo = "unpacked"：每次增量编译都会在 target/debug/deps
# 留下一批新的 .o 文件且不会被清理，几次构建后就是数 GB。这里改为打包调试信息，
# 并且只给本项目代码保留行号信息，依赖不生成调试信息（同时开启优化，egui 在 debug 下更流畅）。
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
strip = true
