[workspace]
members = ["crates/devtools-clipboard", "crates/devtools-hub"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/zvae/devtools_hub"
rust-version = "1.95"
version = "0.1.4"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0"
eframe = "0.36"
egui = "0.36"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp", "webp"] }
objc2 = "0.6"
# 只启用用到的类：默认特性会编译整个 AppKit（单个 rlib 近 180 MB）。
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "NSApplication",
    "NSBitmapImageRep",
    "NSEvent",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSURL",
] }
raw-window-handle = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
# 检查更新用的 HTTP 客户端。TLS 用系统自带的实现与根证书（macOS Security.framework、Windows SChannel），
# 不额外编译 rustls；Windows 上还会读取系统代理设置，两个平台都支持 HTTPS_PROXY 等环境变量。
ureq = { version = "3.4", default-features = false, features = ["native-tls", "win-system-proxy"] }
winit = { version = "0.30", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winresource = "0.1"
zstd = "0.13"

devtools-clipboard = { path = "crates/devtools-clipboard" }

# macOS 上 dev 默认 split-debuginfo = "unpacked"：每次增量编译都会在 target/debug/deps
# 留下一批新的 .o 文件且不会被清理，几次构建后就是数 GB。这里改为打包调试信息，
# 并且只给本项目代码保留行号信息，依赖不生成调试信息（同时开启优化，egui 在 debug 下更流畅）。
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
strip = true
