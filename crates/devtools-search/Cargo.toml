[package]
name = "devtools-search"
description = "DevTools Hub 的文件搜索模块：搜索界面、设置、索引与宿主接入"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
devtools-search-core = { path = "core" }
devtools-ui.workspace = true

anyhow.workspace = true
chrono.workspace = true
directories.workspace = true
egui.workspace = true
notify.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
zstd.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString", "CFUUID"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["std", "FSEvents", "libc", "dispatch2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile.workspace = true
